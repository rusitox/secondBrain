# Production compose — run with an env file:
#   docker compose -f docker-compose.prod.yml --env-file /opt/secondbrain/.env.prod up -d
#
# Required vars: see .env.prod.example
# IMAGE_TAG defaults to "latest", override with:
#   IMAGE_TAG=sha-abc1234 docker compose -f docker-compose.prod.yml ...

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: secondbrain-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: secondbrain
      POSTGRES_USER: secondbrain
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - secondbrain-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondbrain"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ghcr.io/rusitox/secondbrain:${IMAGE_TAG:-latest}
    container_name: secondbrain-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://secondbrain:${DB_PASSWORD}@db:5432/secondbrain
      DATABASE_URL_SYNC: postgresql+psycopg2://secondbrain:${DB_PASSWORD}@db:5432/secondbrain
      FERNET_KEY: ${FERNET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-haiku-4-5-20251001}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/detailed | grep -q '\"status\":\"healthy\"'"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  secondbrain-pgdata:

networks:
  internal:
    driver: bridge
