services:
  db:
    image: pgvector/pgvector:pg16
    container_name: secondbrain-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: secondbrain
      POSTGRES_USER: secondbrain
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - secondbrain-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondbrain"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ghcr.io/rusitox/secondbrain:latest
    container_name: secondbrain-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://secondbrain:${DB_PASSWORD}@db:5432/secondbrain
      DATABASE_URL_SYNC: postgresql+psycopg2://secondbrain:${DB_PASSWORD}@db:5432/secondbrain
      APP_ENV: production
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/detailed | grep -q '\"status\":\"healthy\"'"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  secondbrain-pgdata:
