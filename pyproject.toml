[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secondbrain-cli"
version = "0.1.0"
description = "secondBrain CLI — Your AI Chief of Staff"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
]

[project.scripts]
secondbrain = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*"]
